name: Godot smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "game/**"
      - "src/SeedField.Simulation/**"
      - "src/SeedField.Runtime.Js/**"

permissions:
  contents: read

env:
  DOTNET_gcServer: "1"

jobs:
  save-smoke:
    name: headless save smoke
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build game project
        run: dotnet build game/SeedField.Game/SeedField.Game.csproj -c Debug

      - name: Download Godot 4.7.2 Mono
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "godot.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip" `
            -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "godot")

      - name: Run save smoke
        shell: pwsh
        run: |
          $godot = Get-ChildItem "$env:RUNNER_TEMP/godot" -Recurse -Filter "*_console.exe" | Select-Object -First 1
          & $godot.FullName --headless --path game/SeedField.Game -- --save-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
