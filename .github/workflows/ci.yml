name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build · test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore
        run: dotnet restore SeedField.slnx

      - name: Build
        run: dotnet build SeedField.slnx -c Release --no-restore

      - name: Art manifest freshness
        run: python tools/build_art_manifest.py --check

      - name: Test
        run: dotnet test SeedField.slnx -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Coverage ratchet
        run: python tools/check_coverage.py

      - name: Worker isolation smoke
        run: dotnet run --project src/SeedField.Headless/SeedField.Headless.csproj -c Release --no-build -- --worker-opponent

      - name: Package trust check
        run: dotnet run --project src/SeedField.Headless/SeedField.Headless.csproj -c Release --no-build -- --package-check tests/fixtures/unsigned-package --allow-unsigned --confirm

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            **/TestResults/**/coverage.cobertura.xml
            **/coverage.cobertura.xml
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  perf:
    name: perf · jint
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SeedField.slnx -c Release

      - name: Parallel controller budget
        shell: pwsh
        run: |
          $output = dotnet run --project src/SeedField.Headless/SeedField.Headless.csproj -c Release --no-build -- --benchmark-jint-parallel 100 --budget-ms 60
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) { exit $code }
          if ($output -notmatch 'gcServer=True') {
            Write-Error 'Server GC is not active in the headless benchmark.'
            exit 1
          }

  commit-lint:
    name: commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Lint commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="$before..HEAD"
            fi
          fi
          python tools/check_commit_message.py --range "$range"
