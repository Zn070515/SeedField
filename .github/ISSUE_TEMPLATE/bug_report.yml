name: Bug report
description: 报告可复现的缺陷或规则不一致
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认问题不是由未提交的本地改动或旧构建引起。
  - type: textarea
    id: summary
    attributes:
      label: 现象
      description: 实际发生了什么，期望是什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: hash
    attributes:
      label: 状态哈希 / 种子
      description: 涉及仿真时提供 `WorldStateHasher` 输出或 Tick 号。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - SimulationCore
        - Runtime.Js
        - Godot client
        - Save / migration
        - Workshop / blueprint
        - Docs / build
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、.NET SDK、Godot 版本、提交 SHA。
      placeholder: |
        OS:
        .NET:
        Godot:
        Commit:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志 / 截图 / 测试输出
      description: 请粘贴实际输出，不要只说“失败了”。
